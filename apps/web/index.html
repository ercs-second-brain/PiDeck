<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Issue #294: viewport-fit=cover lets the standalone iOS PWA draw
         edge-to-edge; every edge-anchored surface pads with env(safe-area-inset-*). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1216" />
    <meta name="description" content="Self-hosted AI coding agent orchestration dashboard" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <!-- iOS home-screen web app (issue #179): standalone display + theme;
         web push is not supported on iOS — notifications stay in-app there. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PiDeck" />
    <title>PiDeck</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
