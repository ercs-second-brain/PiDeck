name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    name: Check (selective)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the selective check can diff against the merge
          # base (pull requests) or the pushed parent (direct main pushes).
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Shared with the pre-push git hook (.husky/pre-push) — one selection
      # policy in scripts/check-selective.mjs, no duplicated step lists.
      # The install shell suites (shellcheck + tests, issue #161) run through
      # the @pideck/install build script whenever install/ changes or the
      # full check runs.
      - name: Check
        run: pnpm check:selective --base "${{ github.event_name == 'pull_request' && 'origin/main' || github.event.before }}"
